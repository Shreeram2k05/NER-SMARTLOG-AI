<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal Shield Base -->
    <polygon points="30,2 56,17 56,43 30,58 4,43 4,17" fill="#0b172a" stroke="url(#cyberBlue)" stroke-width="2.5" filter="url(#glow)" />
    
    <!-- Mountain Terrain Silhouette (NER Hills) -->
    <path d="M12 40 L22 26 L30 35 L40 22 L48 40 Z" fill="url(#glowGrad)" />
    
    <!-- AI Connected Route Vectors -->
    <path d="M16 38 L26 28 L38 32 L46 18" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Node Pulse Dots -->
    <circle cx="16" cy="38" r="3.5" fill="#38bdf8" />
    <circle cx="26" cy="28" r="3" fill="#00f2fe" />
    <circle cx="38" cy="32" r="3" fill="#00f2fe" />
    <circle cx="46" cy="18" r="4" fill="#10b981" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <text x="80" y="38" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="23" fill="#f8fafc" letter-spacing="1">
    NER-SMARTLOG <tspan fill="url(#cyberBlue)">AI</tspan>
  </text>
  <text x="82" y="56" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="9" fill="#00f2fe" letter-spacing="2.2">
    LOGISTICS INTELLIGENCE • NER
  </text>
</svg>
